[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "etcd-disk-check"
version = "0.1.0"
description = "Tell whether a disk is fast enough for etcd, from a fio benchmark or live etcd metrics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Satya Prakash Chelluri" }]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
etcd-disk-check = "etcd_disk_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
